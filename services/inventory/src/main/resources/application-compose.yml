server:
  port: 5000

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: app
    password: app
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cache:
    type: simple

cloud:
  aws:
    region:
      static: ap-southeast-1
    stack:
      auto: false
    sqs:
      endpoint: http://localstack:4566

order:
  queue:
    name: lab-shopping-cart-order-events

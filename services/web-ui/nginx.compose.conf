server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mimics CloudFront /api/* -> ALB path-based routing
  location /api/products {
    proxy_pass http://catalog:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/inventory {
    proxy_pass http://inventory:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/orders {
    proxy_pass http://order:6000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

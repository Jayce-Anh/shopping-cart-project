server:
  port: 6000

spring:
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-southeast-1}
    stack:
      auto: false

order:
  queue:
    name: ${AWS_SQS_ORDER_QUEUE:local-order-events}

server:
  port: ${SERVER_PORT}
  tomcat:
    max-threads: 50
    min-spare-threads: 10

spring:
  cloud:
    refresh:
      enabled: false
  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/orders?useSSL=true&requireSSL=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initialization-mode: never
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-southeast-1}
    stack:
      auto: false

order:
  queue:
    name: ${AWS_SQS_ORDER_QUEUE}

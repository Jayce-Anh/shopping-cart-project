server:
  port: 6000

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: app
    password: app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

cloud:
  aws:
    region:
      static: ap-southeast-1
    stack:
      auto: false
    sqs:
      endpoint: http://localstack:4566

order:
  queue:
    name: lab-shopping-cart-order-events

#################################### CERTIFICATE ##########################################

#=============== TLS cert for Grafana (ALB HTTPS target group → pod end-to-end TLS) ===============#
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  secretName: grafana-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ .Values.tls.issuerName | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.tls.grafanaHostname | quote }}

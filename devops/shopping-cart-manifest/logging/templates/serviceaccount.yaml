#################################### SERVICE ACCOUNT ##########################################

#=============== Kibana Service Account ===============#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serviceaccount-efk
  namespace: logging
---
#=============== Fluentd Service Account ===============#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd

---
#=============== Fluentd Cluster Role ===============#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
  labels:
    app: fluentd
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch

---
#=============== Fluentd Cluster Role Binding ===============#
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
